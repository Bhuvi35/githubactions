name: My first CI Pipeline

on:
  push:
    branches:
      -  feature/first-github-action

jobs:
  build:
    runs-on:  ubuntu-latest

    steps:
      -  name: Display message
         run: echo "My first github actions pipeline is working"

      -  name: Check Git version
         run: git --version
       

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "Testing application"

  deploy:
    needs: Test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying application" 
