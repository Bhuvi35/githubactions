name: jon dependencies practice

on:
  push:
    branches:
      - 'feature/**'

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: echo "Building application"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Test
      run: echo "Testing application"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: Deploy
       run: echo "Deploy application"